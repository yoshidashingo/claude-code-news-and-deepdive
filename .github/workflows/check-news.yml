name: Check Claude Code News

on:
  schedule:
    # 毎日 UTC 09:00 (JST 18:00) に実行
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run news check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/check-news.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, open PR, and auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCH_NAME="news/$(date -u +%Y-%m-%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add data/processed.json docs/
          git commit -m "$(cat <<'EOF'
          auto: update news articles and processed state

          Generated by Claude Code News & Deep Dive automation
          EOF
          )"
          git push -u origin "$BRANCH_NAME"

          # 追加された記事ファイルを一覧化
          ARTICLES=$(git diff --name-only main -- docs/ | sed 's/^/- /')
          if [ -z "$ARTICLES" ]; then
            ARTICLES="- (記事なし / processed.json の更新のみ)"
          fi

          PR_URL=$(gh pr create \
            --title "auto: Claude Code ニュース更新 $(date -u +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## 概要

          Claude Code News & Deep Dive の自動チェックにより、新しい記事が生成されました。

          ## 追加された記事

          ${ARTICLES}

          ---
          🤖 Generated by [Claude Code News & Deep Dive](https://github.com/${REPO}) automation
          EOF
          )")

          echo "Created PR: $PR_URL"
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')

          # 自動マージ: 競合があれば main を取り込み「新しい側 (PR) を優先」して再 push
          for attempt in 1 2 3; do
            for _ in 1 2 3 4 5; do
              STATE=$(gh pr view "$PR_NUMBER" --json mergeable -q .mergeable)
              [ "$STATE" != "UNKNOWN" ] && break
              sleep 3
            done

            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Conflict detected on attempt $attempt; merging main into PR with PR-wins strategy"
              git fetch origin main
              if ! git merge origin/main --no-edit -X ours; then
                git merge --abort || true
                break
              fi
              git push origin "$BRANCH_NAME"
              continue
            fi

            if gh pr merge "$PR_NUMBER" --merge --delete-branch; then
              echo "PR #$PR_NUMBER merged"
              exit 0
            fi
            sleep 5
          done

          echo "Auto-merge failed after retries; leaving PR open"
